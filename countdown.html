<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Đếm Ngược</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <button id="back-btn" class="back-btn"><i class="fas fa-arrow-left"></i></button>
    <button id="fullscreen-btn" class="fullscreen-btn"><i class="fas fa-expand"></i></button>

    <div id="countdown" class="fullscreen">
        <h1 id="event-name">Sự kiện</h1>
        <h2><span id="time-remaining">00:00:00</span></h2>
    </div>

    <script src="countdown.js"></script>
    <script src="wake.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            let isFullscreen = false;

            fullscreenBtn.addEventListener('click', () => {
                const countdownElement = document.documentElement; 
                
                if (!isFullscreen) {
                    if (countdownElement.requestFullscreen) {
                        countdownElement.requestFullscreen();
                    } else if (countdownElement.mozRequestFullScreen) {
                        countdownElement.mozRequestFullScreen();
                    } else if (countdownElement.webkitRequestFullscreen) {
                        countdownElement.webkitRequestFullscreen();
                    } else if (countdownElement.msRequestFullscreen) {
                        countdownElement.msRequestFullscreen();
                    }
                    fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        document.mozCancelFullScreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                    fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
                }

                isFullscreen = !isFullscreen;
            });

            // Prevent screen from sleeping on mobile
            if ('wakeLock' in navigator) {
                let wakeLock = null;
                const requestWakeLock = async () => {
                    try {
                        wakeLock = await navigator.wakeLock.request('screen');
                    } catch (err) {
                        console.error(`Wake Lock failed: ${err.name}, ${err.message}`);
                    }
                };
                requestWakeLock();
            }
        });
    </script>
</body>
</html>
